name: Update API Dumps

# Manual trigger only. Runs apiDump on macOS (needed for iOS targets in the
# klib dumps) and commits the regenerated *.api files back to the current branch.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  api-dump:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Work on the branch that dispatch was triggered from.
          ref: ${{ github.head_ref || github.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup gradle
        uses: gradle/gradle-build-action@ac2d340dc04d9e1113182899e983b5400c17cda1

      - name: Generate API dumps
        run: ./gradlew apiDump

      - name: Commit regenerated API dumps
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ':(glob)**/api/**/*.api'
          if git diff --cached --quiet; then
            echo "No API dump changes to commit."
          else
            echo "Staging the following regenerated dumps:"
            git diff --cached --name-status
            git commit -m "chore: regenerate API dumps (binary-compatibility-validator)"
            git push origin HEAD:"${{ github.head_ref || github.ref_name }}"
          fi

      - name: Upload API dumps as artifact (fallback if push is restricted)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: api-dumps
          path: '**/api/**/*.api'
          if-no-files-found: ignore